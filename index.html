<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIVEDIVE · 부산 구역별 가이드북</title>

  <!-- 구글 웹폰트: 영문 세리프(매거진 느낌) + 한글 명조/고딕 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= 메인 배너 ================= -->
  <header class="hero">
    <nav class="hero-nav">
      <div class="nav-left">
        <button class="menu-btn" type="button" aria-label="구역 메뉴 열기">☰</button>
        <span class="logo">VIVEDIVE</span>
      </div>
      <span class="issue">Vol. 01 — Travel Guide</span>
    </nav>

    <div class="hero-content">
      <p class="eyebrow">A Local Guide to Busan</p>
      <h1>일상이 여행이 되는 곳,<br><em>BUSAN</em></h1>
      <p>평범한 하루가 낯선 설렘이 되는 곳,<br>파도 소리가 머무는 카페에서 골목 끝 노포의 온기, 그리고 노을빛 언덕까지</p>
      <a href="#guide" class="hero-btn">가이드 펼치기 ↓</a>
    </div>

    <!-- 파도 그림 (SVG) -->
    <svg class="waves back" viewBox="0 0 2880 90" preserveAspectRatio="none">
      <path fill="#f6f9fb" d="M0 45 Q360 0 720 45 T1440 45 T2160 45 T2880 45 V90 H0Z"/>
    </svg>
    <svg class="waves" viewBox="0 0 2880 90" preserveAspectRatio="none">
      <path fill="#f6f9fb" d="M0 60 Q360 20 720 60 T1440 60 T2160 60 T2880 60 V90 H0Z"/>
    </svg>
  </header>

  <!-- ================= 구역별 추천 ================= -->
  <main id="guide">
    <!-- 검색창: 한 글자만 넣어도 그 글자가 들어간 곳이 모두 나와요 -->
    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="searchInput" placeholder="장소 이름을 검색해 보세요 (예: 국밥, 빙수, 해운대)" autocomplete="off">
      <button class="search-clear" id="searchClear" type="button" aria-label="검색어 지우기" hidden>✕</button>
    </div>
    <p class="search-count" id="searchCount"></p>
    <div id="results" hidden></div>
    <div id="picks"></div>
  </main>

  <footer>
    <span class="logo">VIVEDIVE</span>
    방문 전 영업시간·휴무일은 꼭 다시 확인해 주세요.
  </footer>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script>
    // 구역마다 맨 앞 4곳을 추천으로 보여줘요
    const PICK_COUNT = 4;

    document.getElementById("picks").innerHTML = districts.map(d => `
      <section class="pick">
        <div class="pick-head">
          <div>
            <h2 class="pick-en"><a href="${districtUrl(d)}">${d.en}<span>${d.name}</span></a></h2>
            <p class="pick-tagline">${d.tagline}</p>
          </div>
          <a class="pick-more" href="${districtUrl(d)}">${d.places.length}곳 전체 보기 →</a>
        </div>
        <div class="grid pick-grid">
          ${d.places.slice(0, PICK_COUNT).map(cardHTML).join("")}
        </div>
      </section>`
    ).join("");

    // 검색: 글자를 넣으면 추천 대신 모든 구역에서 찾은 곳을 구역별로 보여줘요
    const searchInput = document.getElementById("searchInput");
    const searchClear = document.getElementById("searchClear");
    const searchCount = document.getElementById("searchCount");
    const resultsEl = document.getElementById("results");
    const picksEl = document.getElementById("picks");

    function renderSearch() {
      const q = searchInput.value.trim();
      searchClear.hidden = !q;
      resultsEl.hidden = !q;
      picksEl.hidden = !!q;
      if (!q) { searchCount.textContent = ""; resultsEl.innerHTML = ""; return; }

      const groups = districts
        .map(d => ({ d, places: searchPlaces(d.places, q) }))
        .filter(g => g.places.length);
      const total = groups.reduce((n, g) => n + g.places.length, 0);
      searchCount.textContent = total
        ? `‘${q}’ 검색 결과 ${total}곳`
        : "";
      if (!total) { resultsEl.innerHTML = noResultHTML(q); return; }
      resultsEl.innerHTML = groups.map(g => `
        <section class="result-group">
          <div class="result-head">
            <a href="${districtUrl(g.d)}">${g.d.name}</a><span>${g.places.length}곳</span>
          </div>
          <div class="grid">${g.places.map(cardHTML).join("")}</div>
        </section>`).join("");
    }
    searchInput.addEventListener("input", renderSearch);
    searchClear.addEventListener("click", () => { searchInput.value = ""; renderSearch(); searchInput.focus(); });

    // 주소에 ?q=국밥 처럼 있으면 그 검색어로 시작
    searchInput.value = new URLSearchParams(location.search).get("q") || "";
    renderSearch();
  </script>
</body>
</html>
