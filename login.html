<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 · VIVEDIVE</title>

  <!-- 구글 웹폰트: 영문 세리프(매거진 느낌) + 한글 명조/고딕 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= 상단 바 ================= -->
  <nav class="topbar">
    <div class="nav-left">
      <button class="menu-btn" type="button" aria-label="구역 메뉴 열기">☰</button>
      <a class="logo" href="index.html">VIVEDIVE</a>
    </div>
    <a class="back-link" href="index.html#guide">← 메인으로</a>
  </nav>

  <!-- ================= 로그인 ================= -->
  <main class="faq auth-page">
    <section class="faq-head">
      <p class="faq-eyebrow">LOG IN</p>
      <h1>로그인</h1>
      <p>로그인하면 원하는 장소를 VIVEDIVE에 추가 신청할 수 있어요.</p>
    </section>

    <form class="auth-card" id="loginForm" novalidate>
      <div class="social-btns" id="socialBtns"></div>
      <p class="auth-divider"><span>또는 아이디로 로그인</span></p>
      <div class="field">
        <label for="userId">아이디</label>
        <input type="text" id="userId" autocomplete="username" placeholder="아이디를 입력해 주세요">
      </div>
      <div class="field">
        <label for="userPw">비밀번호</label>
        <input type="password" id="userPw" autocomplete="current-password" placeholder="비밀번호를 입력해 주세요">
      </div>
      <p class="form-error" id="formError" role="alert"></p>
      <button class="submit-btn" type="submit">로그인</button>
      <p class="auth-switch">아직 회원이 아니신가요?<a id="toSignup" href="signup.html">회원가입</a></p>
    </form>
  </main>

  <footer>
    <span class="logo">VIVEDIVE</span>
    방문 전 영업시간·휴무일은 꼭 다시 확인해 주세요.
  </footer>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="keys.js"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const idEl = document.getElementById("userId");
    const pwEl = document.getElementById("userPw");
    renderSocialButtons(document.getElementById("socialBtns"), "로그인");

    function showError(fields, msg) {
      form.querySelectorAll(".field").forEach(f => f.classList.remove("invalid"));
      fields.forEach(el => el.closest(".field").classList.add("invalid"));
      document.getElementById("formError").textContent = msg;
    }

    document.getElementById("toSignup").href = "signup.html?next=" + encodeURIComponent(next);
    if (currentUser()) location.replace(next); // 이미 로그인했으면 바로 돌아가기

    form.addEventListener("submit", async e => {
      e.preventDefault();
      const id = idEl.value.trim().toLowerCase();
      const pw = pwEl.value;
      if (!id || !pw) {
        return showError([!id && idEl, !pw && pwEl].filter(Boolean), "아이디와 비밀번호를 입력해 주세요.");
      }
      const user = getUsers().find(u => u.id === id);
      if (!user || user.pw !== await hashPassword(id, pw)) {
        return showError([idEl, pwEl], "아이디 또는 비밀번호가 맞지 않아요.");
      }
      writeStore(SESSION_KEY, id);
      location.href = next;
    });
  </script>
</body>
</html>
